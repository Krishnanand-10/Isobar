[package]
name = "isobar-core"
version = "0.1.0"
edition = "2021"
authors = ["Krishnanand Tiwari <nandkrishna2320@gmail.com>"]
description = "High-Throughput In-Memory Telemetry Engine with Spatio-Temporal Indexing"
license = "MIT"
repository = "https://github.com/Krishnanand-10/Isobar.git"

[lib]
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "bench_engine"
harness = false

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
